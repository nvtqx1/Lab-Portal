spring:
  application:
    name: lab-portal-backend
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: LabPortalHikariPool
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    encoding: UTF-8
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

jwt:
  access-token-expiration: ${JWT_EXPIRATION:86400000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

booking:
  task:
    cron: "0 * * * * *"
  penalty:
    default-amount: 0
  outbox:
    poll-delay-ms: ${BOOKING_OUTBOX_POLL_DELAY_MS:1000}
    batch-size: ${BOOKING_OUTBOX_BATCH_SIZE:25}
    max-attempts: ${BOOKING_OUTBOX_MAX_ATTEMPTS:8}
    retry-delay-ms: ${BOOKING_OUTBOX_RETRY_DELAY_MS:5000}
    lock-timeout-ms: ${BOOKING_OUTBOX_LOCK_TIMEOUT_MS:60000}
    retention-days: ${BOOKING_OUTBOX_RETENTION_DAYS:7}
    cleanup-cron: "${BOOKING_OUTBOX_CLEANUP_CRON:0 30 2 * * *}"

app:
  ai:
    default-time-zone: ${AI_DEFAULT_TIME_ZONE:Asia/Ho_Chi_Minh}
  async:
    side-effects:
      core-pool-size: ${SIDE_EFFECT_CORE_POOL_SIZE:2}
      max-pool-size: ${SIDE_EFFECT_MAX_POOL_SIZE:4}
      queue-capacity: ${SIDE_EFFECT_QUEUE_CAPACITY:200}
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
